services:
  - type: web
    name: liquidity-intelligence-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: API_PORT
        value: "10000"
      - key: SOLANA_WS_URL
        value: wss://api.mainnet-beta.solana.com
      - key: BNB_WS_URL
        sync: false
      - key: PUMPPORTAL_WS_URL
        value: wss://pumpportal.fun/api/data
      - key: BNB_LOG_ADDRESSES
        value: ""
      - key: BNB_LOG_TOPICS
        value: ""
